name: Deploy Deep Learning Atlas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
      pages_artifact: github-pages-${{ github.run_attempt }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies (prefer lockfile when available)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Test numerical logic
        run: npm test

      - name: Install CPU PyTorch for chapter examples
        run: |
          python -m pip install --quiet torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet numpy

      - name: Execute every chapter code example
        run: node --experimental-strip-types scripts/check-examples.mjs --execute

      - name: Typecheck and build static site
        run: npm run build

      - name: Install browser for app tests
        run: npx playwright install --with-deps chromium

      - name: Test browser interactions and responsive layouts
        run: npm run test:e2e

      - name: Save browser validation and dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            package-lock.json
          retention-days: 7

      - name: Inspect Pages configuration
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$GH_REPO/pages" --jq '{status, build_type, html_url, public}'; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Build verified. Enable GitHub Pages in Settings > Pages, choose GitHub Actions, then run this workflow again.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact }}

      - name: Verify published HTML and assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, re, time, urllib.request
          from urllib.parse import urljoin
          url = os.environ['SITE_URL']
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      html = response.read().decode('utf-8')
                  assert 'Deep Learning Atlas' in html, 'Unexpected page title'
                  assets = re.findall(r'(?:src|href)="([^\"]+\.(?:js|css))"', html)
                  assert assets, 'No production JavaScript or CSS assets found'
                  for asset in assets:
                      with urllib.request.urlopen(urljoin(url, asset), timeout=20) as response:
                          assert response.status == 200 and response.read(1), asset
                  print('Live site verified:', url, 'Assets:', len(assets))
                  break
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(5)
          PY
